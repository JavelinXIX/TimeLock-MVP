name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Verify and build preview
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: preview-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Restore permanent release key
        if: github.event_name != 'pull_request'
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEY_BASE64" ]; then
            echo 'Release signing secrets are required for an updateable distribution APK.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed distribution
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: TimeLock-install-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
